name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: moku
          POSTGRES_PASSWORD: moku
          POSTGRES_DB: moku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moku -d moku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check
      - run: bun run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://moku:moku@127.0.0.1:5432/moku_test
      - run: bun run build
