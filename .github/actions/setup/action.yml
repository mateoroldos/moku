name: Setup workspace
description: Install Node 24, the pinned Bun toolchain, and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Patch Effect tooling
      shell: bash
      run: bunx effect-tsgo patch --oxlint
    - name: Generate SvelteKit configuration
      shell: bash
      run: bun run --cwd apps/web prepare
