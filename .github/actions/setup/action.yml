name: Setup workspace
description: Install Node 24, the pinned Bun toolchain, and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Patch Effect tooling
      shell: bash
      run: bunx effect-tsgo patch --oxlint
    - name: Generate SvelteKit configuration
      shell: bash
      run: bun run --cwd apps/web prepare
